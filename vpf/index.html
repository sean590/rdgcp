<title>APP Forward Planner</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#18202e;--muted:#5d6676;--line:#dde1e8;--accent:#2b4fb8;--err:#b2362c}
@media (prefers-color-scheme:dark){:root{--bg:#11151c;--card:#19202a;--ink:#e7eaf0;--muted:#9aa3b2;--line:#2b3442;--accent:#7d9bf0;--err:#f07a6e;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box}
form{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px;width:100%;max-width:360px;display:grid;gap:12px}
h1{font-size:20px;margin:0} p{margin:0;color:var(--muted);font-size:14px}
input[type=password]{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
button{font:inherit;font-weight:600;padding:10px;border:0;border-radius:7px;background:var(--accent);color:#fff;cursor:pointer}
label.r{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.err{color:var(--err);font-size:13.5px;min-height:1em}
</style></head><body>
<form id="f">
<h1>APP Forward Planner</h1>
<p>Enter the family password to open the planner.</p>
<input id="pw" type="password" autocomplete="current-password" aria-label="Password" autofocus>
<label class="r"><input id="rem" type="checkbox" checked> Remember on this device</label>
<button type="submit">Open</button>
<div class="err" id="err" role="alert"></div>
</form>

const u=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.iv)},key,u(D.ct));
  return new TextDecoder().decode(pt);
}
async function go(pw,remember){
  try{ const html=await open_(pw);
    try{ if(remember) localStorage.setItem('appvpf_pw',pw); }catch(e){}
    document.open(); document.write(html); document.close(); return true;
  }catch(e){ return false; }
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault(); const err=document.getElementById('err'); err.textContent='Checking…';
  if(!await go(document.getElementById('pw').value,document.getElementById('rem').checked)) err.textContent='That password didn\'t work. Try again.';
});
(async()=>{ let pw=null; try{pw=localStorage.getItem('appvpf_pw');}catch(e){}
  if(pw && !await go(pw,true)){ try{localStorage.removeItem('appvpf_pw');}catch(e){} } })();
</script>
